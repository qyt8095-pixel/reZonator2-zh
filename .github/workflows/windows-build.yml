# Build the Chinese-localized reZonator2 on Windows and upload a portable exe package.
#
# Why this workflow exists:
# - This repository contains the localized source code, but the GitHub App
#   integration used to push it can only push UTF-8 text files. Binary assets
#   (program icons in img/, help screenshots, example images, ...) therefore
#   live only in the upstream repository, not here.
# - The "Restore binary assets" step below downloads the upstream master
#   tarball and copies ONLY files that are missing here. Localized text files
#   are never overwritten, and the binary assets are unlocalized anyway, so
#   they are identical to upstream.
# - Submodules (libs/orion, libs/custom-plot-lab) are fetched by checkout.
#
# Trigger: pushing this file to main starts a run automatically.
# You can also start it manually from the repository's Actions tab
# ("Build Windows exe" -> Run workflow).

name: Build Windows exe

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-build.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # Pinned to windows-2022 on purpose: windows-latest now ships
    # Visual Studio 18 / MSVC 14.51, whose STL removed the 'stdext'
    # namespace that Qt 5.15.2 headers (qvector.h, qlist.h,
    # qvarlengtharray.h) still use. That made the libs/orion build fail
    # with error C3861 / C2065: 'stdext': identifier not found.
    # VS2022 (MSVC v143) still provides stdext, matching the project's
    # documented toolchain (Qt 5.15.2 MSVC 2019 kit + VS2022).
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore binary assets missing from this repo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/orion-project/rezonator2/archive/refs/heads/master.tar.gz' -OutFile "$env:RUNNER_TEMP\upstream.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\upstream" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\upstream.tar.gz" -C "$env:RUNNER_TEMP\upstream"
          $src = "$env:RUNNER_TEMP\upstream\rezonator2-master"
          Get-ChildItem -Recurse -File $src | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $dest = Join-Path $env:GITHUB_WORKSPACE $rel
            if (-not (Test-Path $dest)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item $_.FullName $dest
            }
          }

      # Fetch submodule sources explicitly. The repository index does NOT
      # contain the libs/orion and libs/custom-plot-lab gitlink entries:
      # the GitHub App push used for this repo can only push text files,
      # so the gitlinks were never pushed, and 'checkout with submodules'
      # therefore creates neither directory. Without this step CMake fails
      # with: add_subdirectory given source "libs/orion" which is not an
      # existing directory. The commits below are the ones recorded in
      # the upstream checkout (git ls-files --stage libs/).
      - name: Fetch submodule sources explicitly
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path libs/orion/.git)) {
            Remove-Item libs/orion -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/orion-project/orion-qt libs/orion
          }
          git -C libs/orion checkout 7dd992de2b28509b1d34ff6293a8f7213e6ca8cb
          if (-not (Test-Path libs/custom-plot-lab/.git)) {
            Remove-Item libs/custom-plot-lab -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/orion-project/custom-plot-lab libs/custom-plot-lab
          }
          git -C libs/custom-plot-lab checkout 60f24590ed481a6515ab07f47d97b522d5f9404b
          Get-ChildItem libs/orion, libs/custom-plot-lab | Select-Object FullName

      # No 'modules' here on purpose: for Qt 5.15.2 / win64_msvc2019_64,
      # aqt's available add-on modules do NOT include qtsvg or qttools
      # (verified with 'aqt list-qt windows desktop --modules 5.15.2
      # win64_msvc2019_64'), and passing them makes aqt fail with
      # "The packages ['qtsvg', 'qttools'] were not found". QtSvg and
      # QtHelp (from qttools) are already part of the base Qt install.
      - name: Install Qt 5.15.2 (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lua 5.4.7 static library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.lua.org/ftp/lua-5.4.7.tar.gz' -OutFile "$env:RUNNER_TEMP\lua.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\lua.tar.gz" -C $env:GITHUB_WORKSPACE
          Set-Location "$env:GITHUB_WORKSPACE\lua-5.4.7\src"
          $luaSources = @('lapi.c','lauxlib.c','lbaselib.c','lcode.c','lcorolib.c','lctype.c','ldblib.c','ldebug.c','ldo.c','ldump.c','lfunc.c','lgc.c','linit.c','liolib.c','llex.c','lmathlib.c','lmem.c','loadlib.c','lobject.c','lopcodes.c','loslib.c','lparser.c','lstate.c','lstring.c','lstrlib.c','ltable.c','ltablib.c','ltm.c','lundump.c','lutf8lib.c','lvm.c','lzio.c')
          cl /c /MD /O2 /W3 $luaSources
          lib /OUT:lua.lib *.obj

      # Generator is pinned to VS 2022 because the runner is pinned to
      # windows-2022 (see above: VS18 removed stdext used by Qt 5.15).
      # Note install-qt-action sets Qt5_DIR to ...\msvc2019_64\lib\cmake
      # (not ...\lib\cmake\Qt5), so the Qt prefix is two levels up from it
      # and the Qt5 CMake config dir is Qt5_DIR\Qt5.
      - name: Configure (CMake, Visual Studio 2022, x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $qtDir = $env:Qt5_DIR
          if ($qtDir -match 'lib\\cmake\\Qt5$') {
            $qtPrefix = (Split-Path (Split-Path (Split-Path $qtDir -Parent) -Parent) -Parent)
            $qt5cmake = $qtDir
          } elseif ($qtDir -match 'lib\\cmake$') {
            $qtPrefix = (Split-Path (Split-Path $qtDir -Parent) -Parent)
            $qt5cmake = "$qtDir\Qt5"
          } else {
            $qtPrefix = $qtDir
            $qt5cmake = $qtDir
          }
          Write-Host "Qt5_DIR=$qtDir"
          Write-Host "Qt prefix=$qtPrefix"
          Write-Host "Qt5 CMake dir=$qt5cmake"
          # CMakeLists links a bare "lua" in addition to ${LUA_LIBRARIES},
          # so the linker must be told where lua.lib lives, otherwise it
          # fails with LINK : fatal error LNK1181: cannot open input
          # file 'lua.lib' even though the full-path entry exists.
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DQt5_DIR="$qt5cmake" `
            -DLUA_INCLUDE_DIR="$env:GITHUB_WORKSPACE\lua-5.4.7\src" `
            -DLUA_LIBRARY="$env:GITHUB_WORKSPACE\lua-5.4.7\src\lua.lib" `
            -DCMAKE_EXE_LINKER_FLAGS="/LIBPATH:$env:GITHUB_WORKSPACE\lua-5.4.7\src"

      - name: Build (Release)
        shell: powershell
        run: |
          $env:LIB = "$env:LIB;$env:GITHUB_WORKSPACE\lua-5.4.7\src"
          cmake --build build --config Release --parallel

      - name: Package portable folder with Qt DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item bin\rezonator.exe deploy\
          if (Test-Path bin\examples) { Copy-Item bin\examples deploy\examples -Recurse }
          if (Test-Path bin\templates) { Copy-Item bin\templates deploy\templates -Recurse }
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw deploy\rezonator.exe
          # windeployqt does NOT deploy Python, but rezonator links
          # python312.lib, so the exe fails at startup with
          # "cannot find python312.dll" on a machine without Python.
          # PyRunner on Windows also expects the stdlib next to the exe
          # as {binDir}/python312.zip (see src/core/PyRunner.cpp and
          # release/prepare_python.py). Both files ship with the
          # python.org installation used by setup-python, next to
          # python.exe, so copy them into the package.
          $pyDir = Split-Path (Get-Command python).Source -Parent
          Write-Host "Python dir=$pyDir"
          Copy-Item "$pyDir\python312.dll" deploy\
          # setup-python's hostedtoolcache Python has NO python312.zip
          # (run 7 failed here with PathNotFound), even though it has
          # Lib/. Build the zip from Lib/ the same way upstream's
          # release/prepare_python.py does: a zip of the Lib contents.
          if (Test-Path "$pyDir\python312.zip") {
            Copy-Item "$pyDir\python312.zip" deploy\
          } else {
            Compress-Archive -Path "$pyDir\Lib\*" -DestinationPath deploy\python312.zip -Force
          }
          Get-ChildItem deploy | Select-Object Name, Length

      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The upstream install/win/rezonator.iss expects out/redist and
          # parses version.txt with a dash suffix, neither of which holds
          # here (version is plain 2.3.0), so generate a dedicated script
          # for the Chinese build instead of reusing it verbatim.
          @'
          #define AppName "reZonator2"
          #define AppVer "2.3.0"
          [Setup]
          AppId={{53C38934-A255-44E2-9BE8-84A81E245082}
          AppName={#AppName}
          ; Use ASCII-only AppVerName: non-ASCII in the generated script
          ; came out garbled in the installer title bar (script written
          ; without a BOM is read as ANSI by ISCC).
          AppVerName={#AppName} {#AppVer} Chinese Edition
          AppVersion={#AppVer}
          AppPublisher=qyt8095-pixel
          DefaultDirName={localappdata}\Programs\{#AppName}
          DefaultGroupName={#AppName}
          AllowNoIcons=yes
          LicenseFile=LICENSE
          OutputDir=installer
          OutputBaseFilename=reZonator2-zh-{#AppVer}-setup
          ; Installer file icon = the application's own icon, the same
          ; img/icon/main_2.ico that rezonator.exe itself uses (see
          ; src/app.rc). That file is a binary asset missing from the
          ; repo, but the workflow's restore step copies it from the
          ; upstream tarball before this step runs.
          SetupIconFile=img\icon\main_2.ico
          UninstallDisplayIcon={app}\rezonator.exe
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          [Languages]
          ; Inno Setup's runner install only ships Default.isl; the
          ; official ChineseSimplified.isl is a separate download and
          ; is NOT present, so run 9 failed here with "couldn't open
          ; include file". Keep English installer UI for now; the
          ; application itself is Chinese.
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: checkedonce
          [Files]
          Source: "deploy\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          [Icons]
          Name: "{group}\{#AppName}"; Filename: "{app}\rezonator.exe"
          Name: "{group}\{cm:UninstallProgram,{#AppName}}"; Filename: "{uninstallexe}"
          ; userdesktop, not commondesktop: the installer runs per-user
          ; (PrivilegesRequired=lowest, no elevation), so it cannot write
          ; to C:\Users\Public\Desktop and shortcut creation fails with
          ; IPersistFile::Save 0x80070005 (access denied).
          Name: "{userdesktop}\{#AppName}"; Filename: "{app}\rezonator.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\rezonator.exe"; Description: "{cm:LaunchProgram,{#AppName}}"; Flags: nowait postinstall skipifsilent
          '@ | Out-File -Encoding utf8 installer.iss
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          Get-ChildItem installer | Select-Object Name, Length

      - name: Upload exe package
        uses: actions/upload-artifact@v4
        with:
          name: rezonator2-zh-windows
          path: |
            deploy
            installer/reZonator2-zh-2.3.0-setup.exe
          if-no-files-found: error
