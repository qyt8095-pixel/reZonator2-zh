# Build the Chinese-localized reZonator2 on Windows and upload a portable exe package.
#
# Why this workflow exists:
# - This repository contains the localized source code, but the GitHub App
#   integration used to push it can only push UTF-8 text files. Binary assets
#   (program icons in img/, help screenshots, example images, ...) therefore
#   live only in the upstream repository, not here.
# - The "Restore binary assets" step below downloads the upstream master
#   tarball and copies ONLY files that are missing here. Localized text files
#   are never overwritten, and the binary assets are unlocalized anyway, so
#   they are identical to upstream.
# - Submodules (libs/orion, libs/custom-plot-lab) are fetched by checkout.
#
# Trigger: pushing this file to main starts a run automatically.
# You can also start it manually from the repository's Actions tab
# ("Build Windows exe" -> Run workflow).

name: Build Windows exe

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-build.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # Pinned to windows-2022 on purpose: windows-latest now ships
    # Visual Studio 18 / MSVC 14.51, whose STL removed the 'stdext'
    # namespace that Qt 5.15.2 headers (qvector.h, qlist.h,
    # qvarlengtharray.h) still use. That made the libs/orion build fail
    # with error C3861 / C2065: 'stdext': identifier not found.
    # VS2022 (MSVC v143) still provides stdext, matching the project's
    # documented toolchain (Qt 5.15.2 MSVC 2019 kit + VS2022).
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore binary assets missing from this repo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/orion-project/rezonator2/archive/refs/heads/master.tar.gz' -OutFile "$env:RUNNER_TEMP\upstream.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\upstream" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\upstream.tar.gz" -C "$env:RUNNER_TEMP\upstream"
          $src = "$env:RUNNER_TEMP\upstream\rezonator2-master"
          Get-ChildItem -Recurse -File $src | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $dest = Join-Path $env:GITHUB_WORKSPACE $rel
            if (-not (Test-Path $dest)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item $_.FullName $dest
            }
          }

      # Fetch submodule sources explicitly. The repository index does NOT
      # contain the libs/orion and libs/custom-plot-lab gitlink entries:
      # the GitHub App push used for this repo can only push text files,
      # so the gitlinks were never pushed, and 'checkout with submodules'
      # therefore creates neither directory. Without this step CMake fails
      # with: add_subdirectory given source "libs/orion" which is not an
      # existing directory. The commits below are the ones recorded in
      # the upstream checkout (git ls-files --stage libs/).
      - name: Fetch submodule sources explicitly
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path libs/orion/.git)) {
            Remove-Item libs/orion -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/orion-project/orion-qt libs/orion
          }
          git -C libs/orion checkout 7dd992de2b28509b1d34ff6293a8f7213e6ca8cb
          if (-not (Test-Path libs/custom-plot-lab/.git)) {
            Remove-Item libs/custom-plot-lab -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/orion-project/custom-plot-lab libs/custom-plot-lab
          }
          git -C libs/custom-plot-lab checkout 60f24590ed481a6515ab07f47d97b522d5f9404b
          Get-ChildItem libs/orion, libs/custom-plot-lab | Select-Object FullName

      # No 'modules' here on purpose: for Qt 5.15.2 / win64_msvc2019_64,
      # aqt's available add-on modules do NOT include qtsvg or qttools
      # (verified with 'aqt list-qt windows desktop --modules 5.15.2
      # win64_msvc2019_64'), and passing them makes aqt fail with
      # "The packages ['qtsvg', 'qttools'] were not found". QtSvg and
      # QtHelp (from qttools) are already part of the base Qt install.
      - name: Install Qt 5.15.2 (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # Cache the Qt install in GitHub's cache so later runs do not
          # re-download hundreds of MB of Qt on every clean runner.
          cache: true

            # Set up MSVC without ilammy/msvc-dev-cmd: that action has no
      # Node.js 24 release (latest v1.13.0 targets Node.js 20), so it
      # was the last source of the Node.js 20 deprecation warning.
      # This does the same thing inline: run vcvarsall.bat x64 and
      # export the resulting environment to later steps.
      - name: Set up MSVC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw 'vswhere did not find a Visual Studio install with VC tools' }
          $vcvarsall = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvarsall)) { throw "vcvarsall.bat not found at $vcvarsall" }
          cmd /c "`"$vcvarsall`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat failed with exit code $LASTEXITCODE" }
          $envFile = Get-Content $env:GITHUB_ENV -Raw
          if ($envFile -notmatch 'VC\\Tools\\MSVC') { throw 'MSVC bin dir missing from exported environment' }
          Write-Host "MSVC environment exported from $vcvarsall"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lua 5.4.7 static library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.lua.org/ftp/lua-5.4.7.tar.gz' -OutFile "$env:RUNNER_TEMP\lua.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\lua.tar.gz" -C $env:GITHUB_WORKSPACE
          Set-Location "$env:GITHUB_WORKSPACE\lua-5.4.7\src"
          $luaSources = @('lapi.c','lauxlib.c','lbaselib.c','lcode.c','lcorolib.c','lctype.c','ldblib.c','ldebug.c','ldo.c','ldump.c','lfunc.c','lgc.c','linit.c','liolib.c','llex.c','lmathlib.c','lmem.c','loadlib.c','lobject.c','lopcodes.c','loslib.c','lparser.c','lstate.c','lstring.c','lstrlib.c','ltable.c','ltablib.c','ltm.c','lundump.c','lutf8lib.c','lvm.c','lzio.c')
          cl /c /MD /O2 /W3 $luaSources
          lib /OUT:lua.lib *.obj

      # sccache + GitHub cache: every run starts on a clean runner, so
      # without this the whole C++ build (about 14 minutes) is redone
      # from scratch even when only this workflow file changed. sccache
      # wraps cl.exe and reuses object files whose inputs did not
      # change; the cache key is based on the source tree, and the
      # restore-keys fallback reuses the previous cache when sources
      # did change, so only changed files recompile. The first run
      # with this step still takes full time (it populates the cache);
      # later runs, especially workflow-only changes, should be much
      # faster. Qt itself is cached separately by install-qt-action.
      - name: Set up sccache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install sccache -y --no-progress
          sccache --version

      - name: Restore sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('src/**', 'libs/**', 'CMakeLists.txt') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      # Generator is pinned to VS 2022 because the runner is pinned to
      # windows-2022 (see above: VS18 removed stdext used by Qt 5.15).
      # Note install-qt-action sets Qt5_DIR to ...\msvc2019_64\lib\cmake
      # (not ...\lib\cmake\Qt5), so the Qt prefix is two levels up from it
      # and the Qt5 CMake config dir is Qt5_DIR\Qt5.
      - name: Configure (CMake, Visual Studio 2022, x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $qtDir = $env:Qt5_DIR
          if ($qtDir -match 'lib\\cmake\\Qt5$') {
            $qtPrefix = (Split-Path (Split-Path (Split-Path $qtDir -Parent) -Parent) -Parent)
            $qt5cmake = $qtDir
          } elseif ($qtDir -match 'lib\\cmake$') {
            $qtPrefix = (Split-Path (Split-Path $qtDir -Parent) -Parent)
            $qt5cmake = "$qtDir\Qt5"
          } else {
            $qtPrefix = $qtDir
            $qt5cmake = $qtDir
          }
          Write-Host "Qt5_DIR=$qtDir"
          Write-Host "Qt prefix=$qtPrefix"
          Write-Host "Qt5 CMake dir=$qt5cmake"
          # CMakeLists links a bare "lua" in addition to ${LUA_LIBRARIES},
          # so the linker must be told where lua.lib lives, otherwise it
          # fails with LINK : fatal error LNK1181: cannot open input
          # file 'lua.lib' even though the full-path entry exists.
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DQt5_DIR="$qt5cmake" `
            -DLUA_INCLUDE_DIR="$env:GITHUB_WORKSPACE\lua-5.4.7\src" `
            -DLUA_LIBRARY="$env:GITHUB_WORKSPACE\lua-5.4.7\src\lua.lib" `
            -DCMAKE_EXE_LINKER_FLAGS="/LIBPATH:$env:GITHUB_WORKSPACE\lua-5.4.7\src" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: 5G

      - name: Build (Release)
        shell: powershell
        run: |
          $env:LIB = "$env:LIB;$env:GITHUB_WORKSPACE\lua-5.4.7\src"
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --show-stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: 5G

      - name: Build Chinese help (Sphinx + Qt Help)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Local help is a Qt Help collection (rezonator.qhc) opened with
          # Qt Assistant from the app folder; useOnlineHelp is off by
          # default, so without these files in-app help opens nothing.
          # The help sources are now fully Chinese, so build them here.
          # qcollectiongenerator / assistant ship with the base Qt install
          # (qttools is part of it, not an add-on module).
          foreach ($tool in 'qcollectiongenerator', 'assistant') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Qt tool not found on PATH: $tool"
            }
          }
          python -m pip install --quiet sphinx
          python -m sphinx -b qthelp ./help ./out/help
          Copy-Item help/rezonator.qhcp out/help/
          qcollectiongenerator out/help/rezonator.qhcp
          if (-not (Test-Path out/help/rezonator.qch)) { throw 'rezonator.qch was not built' }
          if (-not (Test-Path out/help/rezonator.qhc)) { throw 'rezonator.qhc was not built' }

      - name: Package portable folder with Qt DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item bin\rezonator.exe deploy\
          if (Test-Path bin\examples) { Copy-Item bin\examples deploy\examples -Recurse }
          if (Test-Path bin\templates) { Copy-Item bin\templates deploy\templates -Recurse }
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw deploy\rezonator.exe
          # windeployqt does NOT deploy Python, but rezonator links
          # python312.lib, so the exe fails at startup with
          # "cannot find python312.dll" on a machine without Python.
          # PyRunner on Windows also expects the stdlib next to the exe
          # as {binDir}/python312.zip (see src/core/PyRunner.cpp and
          # release/prepare_python.py). Both files ship with the
          # python.org installation used by setup-python, next to
          # python.exe, so copy them into the package.
          $pyDir = Split-Path (Get-Command python).Source -Parent
          Write-Host "Python dir=$pyDir"
          Copy-Item "$pyDir\python312.dll" deploy\
          # setup-python's hostedtoolcache Python has NO python312.zip
          # (run 7 failed here with PathNotFound), even though it has
          # Lib/. Build the zip from Lib/ the same way upstream's
          # release/prepare_python.py does: a zip of the Lib contents.
          if (Test-Path "$pyDir\python312.zip") {
            Copy-Item "$pyDir\python312.zip" deploy\
          } else {
            Compress-Archive -Path "$pyDir\Lib\*" -DestinationPath deploy\python312.zip -Force
          }
          # Chinese help built in the previous step: Qt Help collection
          # plus Assistant and the QtHelp/QtSql/QtNetwork DLLs it needs
          # (windeployqt only deploys what rezonator.exe itself links).
          Copy-Item out/help/rezonator.qch deploy\
          Copy-Item out/help/rezonator.qhc deploy\
          $qtBin = Split-Path (Get-Command qcollectiongenerator).Source -Parent
          Copy-Item "$qtBin\assistant.exe" deploy\
          foreach ($dll in 'Qt5Help.dll','Qt5Sql.dll','Qt5Network.dll') {
            if (Test-Path "$qtBin\$dll") { Copy-Item "$qtBin\$dll" deploy\ }
          }
          Get-ChildItem deploy | Select-Object Name, Length

      - name: Build installer with WiX Toolset (MSI)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # WiX Toolset 5 (pinned): a .NET global tool; dotnet is
          # preinstalled on the windows-2022 runner. The WixUI dialog
          # set (WixUI_InstallDir + InstallScopeDlg) lives in the UI
          # extension.
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:Path = "$tools;$env:Path"
          echo $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed with exit code $LASTEXITCODE" }
          # Generate the file list (files.wxs) from deploy/ and the
          # license RTF from LICENSE; both are build-time inputs.
          python installer/gen-files-wxs.py .
          $ver = (Get-Content release/version.txt -Raw).Trim()
                    # Version comes from release/version.txt (single source of
          # truth, no hardcoded version in this file). x64 MSI with a
          # Simplified Chinese UI.
          wix build installer/reZonator2.wxs installer/files.wxs `
            -arch x64 -culture zh-CN -ext WixToolset.UI.wixext `
            -d ProductVersion=$ver -d DeployDir=deploy -d RepoDir=. `
            -o "installer/reZonator2-zh-$ver.msi"
          echo "MSI_NAME=reZonator2-zh-$ver.msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem installer | Select-Object Name, Length

      - name: Validate MSI (ICE + scope wiring)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # ICE57/ICE64 are known false positives for dual-purpose
          # (perUserOrMachine) packages: the Start Menu folders and the
          # HKMU registry keypath redirect together with the install
          # context, but these pre-dual-purpose ICEs treat "might be
          # user-profile" as user-profile. Microsoft's single-package
          # authoring guidance requires ICE105, which still runs.
          wix msi validate "installer/$env:MSI_NAME" -sice ICE57 -sice ICE64
          if ($LASTEXITCODE -ne 0) { throw "wix msi validate failed with exit code $LASTEXITCODE" }
          # Confirm the dual-purpose package defaults and that the
          # install-scope dialog is really wired into the UI: dump the
          # key properties and the navigation rows, and fail if the

          # dialog) is still present.
          $msi = (Resolve-Path "installer/$env:MSI_NAME").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          $view = $db.OpenView("SELECT Property, Value FROM Property WHERE Property IN ('ProductVersion','UpgradeCode','ALLUSERS','MSIINSTALLPERUSER')")
          $view.Execute()
          $props = @{}
          while ($rec = $view.Fetch()) { $props[$rec.StringData(1)] = $rec.StringData(2); Write-Host "$($rec.StringData(1)) = $($rec.StringData(2))" }
          $view.Close()
          $ver = (Get-Content release/version.txt -Raw).Trim()
          if ($props['ProductVersion'] -ne $ver) { throw "ProductVersion mismatch: $($props['ProductVersion']) vs $ver" }
          if ($props['ALLUSERS'] -ne '2') { throw "ALLUSERS is not 2 (dual-purpose default): $($props['ALLUSERS'])" }
          if ($props['MSIINSTALLPERUSER'] -ne '1') { throw "MSIINSTALLPERUSER is not 1 (per-user default): $($props['MSIINSTALLPERUSER'])" }
          $view = $db.OpenView("SELECT Dialog_, Control_, Event, Argument FROM ControlEvent WHERE Event = 'NewDialog' AND Dialog_ IN ('LicenseAgreementDlg','InstallScopeDlg','InstallDirDlg') AND Control_ IN ('Next','Back')")
          $view.Execute()
          $nav = @()
          while ($rec = $view.Fetch()) { $nav += "$($rec.StringData(1)).$($rec.StringData(2)) -> $($rec.StringData(4))"; Write-Host "Nav: $($nav[-1])" }
          $view.Close()
          if ($nav -notcontains 'LicenseAgreementDlg.Next -> InstallScopeDlg') { throw 'Scope dialog is not wired after the license dialog' }
          if ($nav -contains 'LicenseAgreementDlg.Next -> InstallDirDlg') { throw 'Stock navigation (license -> install dir) is still present; scope dialog would be skipped' }
          if ($nav -notcontains 'InstallScopeDlg.Next -> InstallDirDlg') { throw 'Scope dialog does not lead to the install dir dialog' }
          if ($nav -notcontains 'InstallDirDlg.Back -> InstallScopeDlg') { throw 'Install dir dialog does not go back to the scope dialog' }

      - name: Upload exe package
        uses: actions/upload-artifact@v6
        with:
          name: rezonator2-zh-windows
          path: |
            deploy
            installer/${{ env.MSI_NAME }}
          if-no-files-found: error
